<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 启用现代移动端 100dvh 防遮挡，禁止缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <!-- 网页标签上的太阳图标 -->
    <link rel="icon" href="https://api.iconify.design/meteocons:clear-day-fill.svg" type="image/svg+xml">
    <title>黑金视界</title>
    
    <style>
        /* CSS Reset & 基础黑金设定 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            /* 使用 dvh 完美解决 iOS 底部控制栏和键盘遮挡问题 */
            height: 100dvh; 
            width: 100%;
            background-color: #050505;
            color: #E0E0E0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航 - 黑金玻璃拟态 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            padding-top: env(safe-area-inset-top, 15px); /* 适配刘海屏 */
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            z-index: 10;
        }
        
        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #FFD700;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        /* 太阳图标 */
        .sun-icon {
            width: 24px;
            height: 24px;
            fill: #FFD700;
        }

        .header-controls { display: flex; gap: 10px; }
        
        .btn {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #FFD700;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.3s;
        }
        .btn:active { background: rgba(255, 215, 0, 0.3); }

        /* 倒计时面板 */
        .timer-bar {
            text-align: center;
            font-size: 0.8rem;
            color: #FF6B6B;
            padding: 5px;
            background: rgba(0,0,0,0.8);
            border-bottom: 1px solid rgba(255, 107, 107, 0.2);
        }

        /* 聊天区域 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        
        /* 玻璃拟态气泡 */
        .msg-sys {
            align-self: center;
            background: rgba(255, 255, 255, 0.05);
            color: #888;
            font-size: 0.8rem;
            border-radius: 20px;
            padding: 5px 15px;
        }
        .msg-mine {
            align-self: flex-end;
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #FFF;
            border-bottom-right-radius: 2px;
        }
        .msg-other {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #E0E0E0;
            border-bottom-left-radius: 2px;
        }

        /* 输入区域 - 防遮挡重点 */
        .input-area {
            padding: 10px 15px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 215, 0, 0.15);
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #FFF;
            padding: 12px 15px;
            border-radius: 20px;
            font-size: 1rem;
            outline: none;
            max-height: 100px;
            resize: none;
        }
        .chat-input::placeholder { color: #666; }
        
        .send-btn {
            background: linear-gradient(135deg, #FFD700, #DAA520);
            color: #000;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-weight: bold;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        /* 遮罩层 (用于无频道时提示输入) */
        #room-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal-box {
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            width: 80%;
            max-width: 320px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
        }
        .modal-input {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #FFD700;
            color: #FFF;
            border-radius: 8px;
            text-align: center;
            font-size: 1.1rem;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <header class="header">
        <div class="header-title">
            <svg class="sun-icon" viewBox="0 0 24 24"><path d="M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM11 1h2v3h-2V1zm0 19h2v3h-2v-3zM3.515 4.929l1.414-1.414L7.05 5.636 5.636 7.05 3.515 4.93zM16.95 18.364l1.414-1.414 2.121 2.121-1.414 1.414-2.121-2.121zm2.121-14.85l1.414 1.415-2.121 2.121-1.414-1.414 2.121-2.121zM5.636 16.95l1.414 1.414-2.121 2.121-1.414-1.414 2.121-2.121zM23 11v2h-3v-2h3zM4 11v2H1v-2h3z"/></svg>
            <span>黑金视界</span>
        </div>
        <div class="header-controls">
            <button class="btn" onclick="handleAnnouncement()">公告</button>
        </div>
    </header>

    <!-- 自毁倒计时 -->
    <div class="timer-bar" id="destruct-timer">通道安全校验中...</div>

    <!-- 聊天区域 -->
    <div class="chat-container" id="chat-box">
        <!-- 消息会在这里动态生成 -->
    </div>

    <!-- 底部输入框 (利用 Flex 和 dvh 完美贴合键盘上方) -->
    <div class="input-area">
        <input type="text" id="msg-input" class="chat-input" placeholder="输入信息..." autocomplete="off">
        <button class="send-btn" onclick="sendMessage()">发送</button>
    </div>

    <!-- 通行码输入弹窗 -->
    <div id="room-modal">
        <div class="modal-box">
            <h3 style="color: #FFD700; margin-bottom: 10px;">黑金视界验证</h3>
            <p style="color: #aaa; font-size: 0.9rem;">请输入频道通行码连接</p>
            <input type="text" id="manual-room-input" class="modal-input" placeholder="输入通行码">
            <button class="btn" style="width: 100%; margin-top: 20px; padding: 12px;" onclick="joinManualRoom()">进入</button>
        </div>
    </div>

    <script>
        // --- 核心全局变量 ---
        let currentRoom = null;
        let tempUserId = 'User_' + Math.random().toString(36).substr(2, 6);
        let destructTimeMs = (12 * 60 * 60 * 1000) + (60 * 1000); // 12小时零1分钟

        // --- 页面加载启动 ---
        window.addEventListener('DOMContentLoaded', () => {
            initSystem();
        });

        // 核心功能 1：URL净化与房间初始化
        function initSystem() {
            const urlParams = new URLSearchParams(window.location.search);
            let urlRoom = urlParams.get('room') || window.location.hash.substring(1);

            if (urlRoom) {
                // 瞬间将参数锁入本地存储
                localStorage.setItem('blackgold_secure_room', urlRoom);
                // 魔法净化：清理地址栏，让苹果主屏幕只能抓取到根域名
                window.history.replaceState(null, null, window.location.pathname);
                currentRoom = urlRoom;
            } else {
                // 如果地址栏是干净的，尝试从本地读取
                currentRoom = localStorage.getItem('blackgold_secure_room');
            }

            if (currentRoom) {
                startSecureSession();
            } else {
                document.getElementById('room-modal').style.display = 'flex';
            }
            
            // 启动自毁倒计时
            startDestructTimer();
            // 防止iOS拉伸导致的失焦问题
            setupKeyboardFix();
        }

        function joinManualRoom() {
            const val = document.getElementById('manual-room-input').value.trim();
            if (val) {
                currentRoom = val;
                localStorage.setItem('blackgold_secure_room', val);
                document.getElementById('room-modal').style.display = 'none';
                startSecureSession();
            }
        }

        function startSecureSession() {
            appendSysMessage("成功接入保密频道: " + currentRoom);
            appendSysMessage("临时身份已生成: " + tempUserId);
            appendSysMessage("系统已就绪。所有信息将于12小时后物理销毁。");
        }

        // 核心功能 2：公告按钮密码门控
        function handleAnnouncement() {
            const pwd = prompt("请输入管理权限密码：");
            if (pwd === "5214") {
                const announcement = prompt("权限验证通过。请输入要发布的公告内容：");
                if (announcement) {
                    appendSysMessage("【系统公告】 " + announcement);
                    // 这里可以加入将公告同步给其他用户的逻辑
                }
            } else if (pwd !== null) {
                alert("密码错误，拒绝访问。");
            }
        }

        // 核心功能 3：12小时零1分自毁机制
        function startDestructTimer() {
            // 记录初始启动时间，存入 session 保证刷新不重置（除非重新建立连接）
            let startTime = sessionStorage.getItem('bg_start_time');
            if (!startTime) {
                startTime = Date.now();
                sessionStorage.setItem('bg_start_time', startTime);
            }

            const timerEl = document.getElementById('destruct-timer');
            
            setInterval(() => {
                const elapsed = Date.now() - parseInt(startTime);
                const remaining = destructTimeMs - elapsed;

                if (remaining <= 0) {
                    executeSelfDestruct();
                } else {
                    const h = Math.floor(remaining / (1000 * 60 * 60));
                    const m = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((remaining % (1000 * 60)) / 1000);
                    timerEl.innerText = `通道存活时间: ${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                }
            }, 1000);
        }

        function executeSelfDestruct() {
            localStorage.removeItem('blackgold_secure_room');
            sessionStorage.removeItem('bg_start_time');
            document.body.innerHTML = '<div style="color:#FF6B6B; display:flex; height:100dvh; align-items:center; justify-content:center; font-size:1.5rem; text-shadow:0 0 10px #FF6B6B;">安全协议触发，当前会话已彻底销毁。</div>';
        }

        // --- 基础发信UI与交互优化 ---
        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (text) {
                // 显示自己的消息
                appendMessage(text, 'msg-mine');
                input.value = '';
                
                // 这里接入你的 WebRTC 或 WebSocket 发送逻辑
                // sendToNetwork(text);
                
                // 模拟对方回复（开发测试用，可删除）
                setTimeout(() => {
                    appendMessage("收到信息。", 'msg-other');
                }, 1000);
            }
        }

        // 监听回车发送
        document.getElementById('msg-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // 滚动到底部
        function scrollToBottom() {
            const box = document.getElementById('chat-box');
            box.scrollTop = box.scrollHeight;
        }

        function appendMessage(text, className) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = 'message ' + className;
            div.innerText = text;
            box.appendChild(div);
            scrollToBottom();
        }

        function appendSysMessage(text) {
            appendMessage(text, 'msg-sys');
        }

        // 修复 iOS 键盘收起后页面留白的 bug
        function setupKeyboardFix() {
            const inputElements = document.querySelectorAll('input, textarea');
            inputElements.forEach((el) => {
                el.addEventListener('blur', () => {
                    setTimeout(() => {
                        window.scrollTo(0, 0);
                    }, 100);
                });
            });
        }
    </script>
</body>
</html>
